# Traefik (HTTPS automático) + Portainer. Deploy direto (docker stack deploy) pelo wizard, passo 1.
version: "3.8"
services:
  traefik:
    image: ${IMG_TRAEFIK}
    command:
      - --api.dashboard=false
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=network_public
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=3600
      - --certificatesresolvers.letsencryptresolver.acme.httpchallenge=true
      - --certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencryptresolver.acme.storage=/etc/traefik/letsencrypt/acme.json
      - --certificatesresolvers.letsencryptresolver.acme.email=${ACME_EMAIL}
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - volume_swarm_certificates:/etc/traefik/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [network_public]
    ports:
      - {target: 80, published: 80, mode: host}
      - {target: 443, published: 443, mode: host}
    deploy:
      placement: {constraints: [node.role == manager]}

  agent:
    image: ${IMG_PORTAINER_AGENT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [network_public]
    deploy:
      mode: global
      placement: {constraints: [node.platform.os == linux]}

  portainer:
    image: ${IMG_PORTAINER}
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    volumes: [portainer_data:/data]
    networks: [network_public]
    deploy:
      placement: {constraints: [node.role == manager]}
      labels:
        - traefik.enable=true
        - traefik.http.routers.portainer.rule=Host(`${HOST_PORTAINER}`)
        - traefik.http.routers.portainer.entrypoints=websecure
        - traefik.http.routers.portainer.tls.certresolver=letsencryptresolver
        - traefik.http.services.portainer.loadbalancer.server.port=9000
        - traefik.docker.network=network_public

volumes:
  volume_swarm_certificates: {external: true, name: volume_swarm_certificates}
  portainer_data: {external: true, name: portainer_data}
networks:
  network_public: {external: true, name: network_public}

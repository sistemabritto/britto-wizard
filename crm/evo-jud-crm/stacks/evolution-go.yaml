# WhatsApp: evogo-jud (fork do Evolution Go com pool de conexões compartilhado, vídeo e histórico).
# No CRM: Caixas de entrada > WhatsApp > provedor Evolution Go > URL https://${HOST_WHATSAPP} e a EVOGO_GLOBAL_API_KEY.
version: "3.8"
services:
  evolution_go:
    image: ${IMG_EVOLUTION_GO}
    environment:
      - SERVER_PORT=4000
      - CLIENT_NAME=${EVOGO_CLIENT_NAME}
      - GLOBAL_API_KEY=${EVOGO_GLOBAL_API_KEY}
      - POSTGRES_AUTH_DB=postgresql://postgres:${POSTGRES_EVOGO_PASSWORD}@postgres:5432/evolution_go_auth?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://postgres:${POSTGRES_EVOGO_PASSWORD}@postgres:5432/evolution_go_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=true
      - CONNECT_ON_STARTUP=true
      - GIN_MODE=release
      - OS_NAME=Linux
      - WADEBUG=INFO
      - LOGTYPE=console
      - LOG_DIRECTORY=/app/logs
      - LOG_MAX_SIZE=100
      - LOG_MAX_BACKUPS=5
      - LOG_MAX_AGE=30
      - LOG_COMPRESS=true
      - WEBHOOKFILES=true
    volumes:
      - evolution_go_data:/app/dbdata
      - evolution_go_logs:/app/logs
    networks: [network_public]
    deploy:
      placement: {constraints: [node.role == manager]}
      resources: {limits: {cpus: "0.5", memory: 512M}}
      labels:
        - traefik.enable=true
        - traefik.http.routers.evolution_go.rule=Host(`${HOST_WHATSAPP}`)
        - traefik.http.routers.evolution_go.entrypoints=websecure
        - traefik.http.routers.evolution_go.tls.certresolver=letsencryptresolver
        - traefik.http.services.evolution_go.loadbalancer.server.port=4000
        - traefik.docker.network=network_public
volumes:
  evolution_go_data: {external: true, name: evolution_go_data}
  evolution_go_logs: {external: true, name: evolution_go_logs}
networks:
  network_public: {external: true, name: network_public}
